<html>

    <head>
        <title>🎯 Who Does What</title>
        <link rel="stylesheet" href="index.css">
        <script src="index.js"></script>
    </head>

    <body onload="init()">       

        <!-- HIDDEN ELEMENTS FOR LOAD / SAVE FUNCTIONALITY -->       
        <input id="uploadInputElem" type="file" accept=".json" onchange="fileLoadSelected()" style="display:none">
        <a id="downloadAnchorElem" style="display:none"></a>
        
        <div id="modalBackdrop"></div>
        
        <!-- DIALOG: NEW RESPONSIBILITY -->
        <div id="createRespDialog" class="dialog">  
            <div class="dialogHeaderBar"><span class="dialogHeaderBarText">New Objective</span>
                <button class="dialogButtonX" onclick="respDialogXClicked()">X</button>
            </div>
            <div class="dialogInput">                
                <div class="dialogInputLine">
                    <input id="respNameInput" class="disableInViewMode" type="text" value="Title"></input>
                </div>

                <h3>Detailed Responsibilities</h3>
                <div class="dialogInputLine">                    
                    <textarea id="objectiveRespInput1" class="disableInViewMode" rows="2" value=""></textarea><br>
                    <textarea id="objectiveRespInput2" class="disableInViewMode" rows="2" value=""></textarea><br>
                    <textarea id="objectiveRespInput3" class="disableInViewMode" rows="2" value=""></textarea><br>
                    <textarea id="objectiveRespInput4" class="disableInViewMode" rows="2" value=""></textarea><br>
                    <textarea id="objectiveRespInput5" class="disableInViewMode" rows="2" value=""></textarea><br>
                    <textarea id="objectiveRespInput6" class="disableInViewMode" rows="2" value=""></textarea><br>
                </div>

                <h3 class="editableOnly">Allocated Hours / Week</h3>
                <div class="dialogInputLine editableOnly">
                    <input id="respHoursInput" type="number" value="8"></input><br>                    
                </div>
                <button class="dialogBtn"              id="createObjectiveBtn" onclick="createObjectiveBtnClicked()">Create</button>
                <button class="dialogBtn editableOnly" id="updateObjectiveBtn" onclick="updateObjectiveBtnClicked()">Save</button>
            </div>                        
        </div>

         <!-- DIALOG: NEW TEAM MEMBER -->
         <div id="createTeamMemberDialog" class="dialog">  
            <div class="dialogHeaderBar">New Team Member
                <button class="dialogButtonX" onclick="teamMemberDialogXClicked()">X</button>
            </div>
            <div class="dialogInput">                
                <div class="dialogInputLine">
                    <input id="teamMemberNameInput" type="text" value="Name"></input>
                </div>
                <div class="dialogInputLine">
                    <input id="teamMemberPositionInput" type="text" value="Title"></input>
                </div>
                <div class="dialogInputLine">
                    <input id="teamMemberHoursInput" type="number" value="8"></input><br>
                    <label for="teamMemberHoursInput">h / week</label>
                </div>
                <button class="dialogBtn" onclick="createTeamMemberBtnClicked()">Create</button>
            </div>                        
        </div>

        <!-- DIALOG: CONFIRM CHOICE -->
        <div id="confirmDialog" class="dialog">
            <div id="confirmDialogHeaderBar" class="dialogHeaderBar">Confirm Choice</div>
            <div id="confirmDialogText">
                Please confirm
            </div>
            <button id="confirmDialogOKBtn" class="dialogBtn" onclick="gConfirmDialogCallback(true)">OK</button>
            <button id="confirmDialogCancelBtn" class="dialogBtn" onclick="gConfirmDialogCallback(false)">Cancel</button>
        </div>

        <!-- TEAM CANVAS -->
        <div id="teamCanvas">
            <!-- team members go here -->
        </div>

        <!-- CREATION PANEL -->
        <div id="creationPanel">
            
            <h1>Who Does What // v0.1-dev</h1>

            <div class="toolPanelSection">
                <button class="toolBtn" onclick="loadBtnClicked()">💾 Load</button>
                <button class="toolBtn" onclick="saveBtnClicked()">💾 Save</button>
                <!--button class="toolBtn" onclick="unlockEditing()">🔒/🔓</button-->
            </div>

            <div class="toolPanelSection">

                <h2>Objectives Backlog</h2>

                <div id="respCreationArea">
                    <!-- objectives go here -->
                </div>

                <button class="newElemBtn" onclick="newRespBtnClicked()">🎯New Objective</button>

            </div>

            <div class="toolPanelSection">

                <button class="newElemBtn" onclick="newTeamMemberBtnClicked()">🏋️ New Team Member</button>

            </div>

        </div>

    </body>

</html>
